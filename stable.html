<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>버그헌터즈 안정판</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:system-ui;color:white}button{font:inherit;touch-action:manipulation}#title,#game{position:fixed;inset:0}#title{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;padding:30px;background:#10233a url('assets/title.png') center/cover no-repeat}#title:before{content:'';position:absolute;inset:0;background:linear-gradient(#0002,#000d)}#title>*{position:relative}h1{font-size:42px;margin:0;text-shadow:0 8px 20px #000}.btn{border:0;border-radius:18px;padding:15px 24px;min-width:230px;font-weight:900;background:linear-gradient(120deg,#82f7c1,#6bb2ff,#a573ed);color:#101522}#game{display:none;background:#71c77c;touch-action:none;user-select:none}#map{position:absolute;inset:-50%;background:#71c77c url('assets/map_background.png') center/cover repeat;transform-origin:50% 50%}#player{position:absolute;left:50%;top:50%;width:100px;height:120px;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 12px 14px #0008);display:flex;align-items:center;justify-content:center;font-size:64px}#player img{width:100%;height:100%;object-fit:contain}.bug{position:absolute;left:50%;top:50%;z-index:4;text-align:center}.icon{width:70px;height:70px;border-radius:22px;background:#fffffff2;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 12px 22px #0006,0 0 20px var(--c);font-size:32px}.icon img{width:100%;height:100%;object-fit:contain}.label{font-size:12px;font-weight:900;text-shadow:0 2px 8px #000}.hud{position:absolute;left:10px;right:10px;top:10px;z-index:9;display:flex;justify-content:space-between}.card{background:#ffffffdd;color:#111;border-radius:16px;padding:10px 12px;font-weight:900}.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#000b;border-radius:999px;padding:10px 14px;z-index:20;display:none}.bottom{position:absolute;left:0;right:0;bottom:0;padding:12px;z-index:9;text-align:center}.mini{border:0;border-radius:14px;padding:12px 16px;background:#ffffff33;color:white;font-weight:900}#enc{position:fixed;inset:0;background:#000a;display:none;z-index:30}#encCard{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,420px);background:white;color:#111;border-radius:24px;overflow:hidden;padding:16px;text-align:center}#encIcon{margin:0 auto 10px;width:110px;height:110px;border-radius:30px;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;overflow:hidden}#encIcon img{width:100%;height:100%;object-fit:contain}.bar{height:32px;border-radius:18px;background:linear-gradient(90deg,#e94d73 0 22%,#ffd166 22% 38%,#20b486 38% 62%,#ffd166 62% 78%,#e94d73 78%);position:relative;overflow:hidden;margin:12px 0}.cur{position:absolute;top:-4px;width:6px;height:42px;background:#111;border-radius:4px;box-shadow:0 0 0 2px white}.row{display:flex;gap:8px}.row button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:900}.catch{background:linear-gradient(120deg,#82f7c1,#6bb2ff)}</style></head><body><div id="title"><h1>버그헌터즈</h1><div>안정판 · 터치/드래그 복구</div><button id="start" class="btn">탐험 시작</button></div><div id="game"><div id="map"></div><div id="bugs"></div><div id="player"><img src="assets/player.png" onerror="this.remove();player.textContent='🧢'"></div><div class="hud"><div class="card">드래그 이동</div><div class="card">POINT <span id="pt">0</span></div></div><div class="bottom"><button class="mini" onclick="spawn();toast('곤충 재배치')">곤충 재배치</button></div><div id="toast" class="toast"></div></div><div id="enc"><div id="encCard"><div id="encIcon"></div><b id="encName"></b><div class="bar"><div id="cur" class="cur"></div></div><div id="judge">타이밍!</div><div class="row"><button onclick="closeEnc()">닫기</button><button class="catch" onclick="catchBug()">채집!</button></div></div></div><script>const B=[['개미','ant.png','🐜'],['나비','cabbage_butterfly.png','🦋'],['청띠나비','blue_band_butterfly.png','🦋'],['잠자리','brown_dragonfly.png','🪰'],['물방개','diving_beetle.png','🪲'],['반딧불이','firefly.png','✨'],['말벌','giant_hornet.png','🐝'],['귀뚜라미','cricket.png','🦗']];const G=[['빨강','#ff4a4a',10,.72,1],['주황','#ff9d3d',14,.70,1.05],['노랑','#ffe45c',18,.68,1.1],['초록','#43d96b',24,.65,1.15],['파랑','#4fb2ff',32,.62,1.22],['남색','#4967ff',42,.58,1.3],['보라','#a573ed',56,.54,1.4],['실버','#d8e3ee',76,.5,1.5],['골드','#ffd166',110,.46,1.6],['다이아','#9ff8ff',180,.42,1.75]];let x=0,y=0,h=0,drag=0,lx=0,ly=0,vx=0,vy=0,bugs=[],cur=null,pts=0,t0=0;const $=s=>document.querySelector(s);function grade(){let r=Math.random();return G[r<.01?9:r<.03?8:r<.07?7:r<.13?6:r<.22?5:r<.34?4:r<.48?3:r<.64?2:r<.82?1:0]}function img(b){return `<img src="assets/insects/${b[1]}" onerror="this.remove();this.parentNode.textContent='${b[2]}'">`}function start(){title.style.display='none';game.style.display='block';spawn();toast('화면을 드래그해 이동')}function spawn(){bugs=[];bugsEl.innerHTML='';for(let i=0;i<5;i++){let b=B[Math.floor(Math.random()*B.length)],g=grade(),e=document.createElement('div');e.className='bug';e.innerHTML=`<div class="icon" style="--c:${g[1]}">${img(b)}</div><div class="label">${g[0]} ${b[0]}</div>`;bugsEl.appendChild(e);bugs.push({b,g,dx:(Math.random()*2-1)*55,dy:(Math.random()*2-1)*55,e})}}const bugsEl=$('#bugs');function render(){h+=vx*.2;map.style.transform=`rotate(${-h}deg) translate(${-x*2}px,${-y*2}px) scale(1.05)`;for(const o of bugs){let px=o.dx*7,py=o.dy*7,d=Math.hypot(o.dx,o.dy);o.e.style.transform=`translate(calc(50% + ${px}px),calc(50% + ${py}px)) translate(-50%,-50%) scale(${Math.max(.55,1.25-d/70)}) rotate(${h}deg)`;o.e.style.opacity=d>15?.55:1;o.e.onclick=()=>{if(d>15)toast('더 가까이 가야 해');else openEnc(o)}}pt.textContent=pts;requestAnimationFrame(render)}function move(){x+=vx;y+=vy;for(const o of bugs){o.dx-=vx;o.dy-=vy}vx*=.88;vy*=.88;setTimeout(move,16)}game.addEventListener('pointerdown',e=>{drag=1;lx=e.clientX;ly=e.clientY});game.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;vx=dx*.025;vy=-dy*.025});game.addEventListener('pointerup',()=>drag=0);game.addEventListener('pointercancel',()=>drag=0);function openEnc(o){cur=o;t0=performance.now();encIcon.style.setProperty('--c',o.g[1]);encIcon.innerHTML=img(o.b);encName.textContent=o.g[0]+' '+o.b[0];enc.style.display='block'}function closeEnc(){enc.style.display='none';cur=null}function pos(){return(0.5+0.5*Math.sin((performance.now()-t0)*.001*Math.PI*2*(cur?cur.g[4]:1)))*100}function judgement(p){let d=Math.abs(p-50);return d<8?['PERFECT',.25,1.5]:d<17?['GREAT',.15,1.25]:d<28?['GOOD',.07,1.1]:['MISS',-.12,.8]}function loopEnc(){if(cur){let p=pos(),j=judgement(p);curEl.style.left=`calc(${p}% - 3px)`;judge.textContent=j[0]}requestAnimationFrame(loopEnc)}function catchBug(){let p=pos(),j=judgement(p),rate=Math.max(.1,Math.min(.95,cur.g[3]+j[1]));if(Math.random()<rate){pts+=Math.round(cur.g[2]*j[2]);cur.e.remove();bugs=bugs.filter(z=>z!==cur);toast(j[0]+' 채집 성공');closeEnc()}else toast(j[0]+' 실패')}function toast(s){toastEl.textContent=s;toastEl.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.style.display='none',1200)}const toastEl=$('#toast'),curEl=$('#cur');startBtn=$('#start');startBtn.onclick=start;startBtn.ontouchend=e=>{e.preventDefault();start()};move();render();loopEnc();</script></body></html>
