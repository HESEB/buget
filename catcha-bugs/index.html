<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CATCHA BUGS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="titleScreen" class="screen active">
      <div class="hero">
        <h1>CATCHA BUGS</h1>
        <p>곤충을 찾고, 관찰하고, 채집하는 탐험 게임</p>
        <button id="startBtn" type="button">탐험 시작</button>
      </div>
    </section>

    <section id="fieldScreen" class="screen">
      <canvas id="gameCanvas" width="390" height="844"></canvas>
      <div class="hud top">
        <div class="panel">
          <strong id="areaName">숲</strong>
          <span>드래그 이동 테스트</span>
        </div>
        <div class="panel">POINT <strong id="pointText">0</strong></div>
      </div>
      <div class="hud bottom">
        <button type="button" id="radarBtn">📡 레이더</button>
        <button type="button" id="dexBtn">📖 도감</button>
      </div>
    </section>
  </main>
  <script src="js/core.js"></script>
  <script src="js/radar.js"></script>
</body>
</html>
