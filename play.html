<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>버그헌터즈 Play</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:system-ui}button{touch-action:manipulation}#title,#game{position:fixed;inset:0}#title{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:32px 18px;box-sizing:border-box;color:white;text-align:center;background:#07111e url('assets/title.png') center/cover no-repeat}#title:before{content:'';position:absolute;inset:0;background:linear-gradient(#0002,#000d)}#title>*{position:relative}.logo{font-size:42px;font-weight:1000;text-shadow:0 12px 24px #000}.btn{border:0;border-radius:18px;padding:15px 22px;min-width:230px;font-size:16px;font-weight:1000;background:linear-gradient(120deg,#82f7c1,#6bb2ff,#a573ed);color:#101522}#game{display:none;background:#70c878;touch-action:none;user-select:none}.map{position:absolute;inset:-50%;background:#70c878 url('assets/map_background.png') center/cover repeat;transform-origin:50% 50%}.player{position:absolute;left:50%;top:50%;width:100px;height:120px;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 16px 18px #0007);display:flex;align-items:center;justify-content:center;font-size:70px}.player img{width:100%;height:100%;object-fit:contain}.bug{position:absolute;left:50%;top:50%;z-index:4;text-align:center}.bug .sp{width:68px;height:68px;border-radius:20px;background:#fffffff0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #ffd166;box-shadow:0 10px 22px #0005}.bug img{width:100%;height:100%;object-fit:contain}.lab{font-size:11px;color:white;font-weight:900;text-shadow:0 2px 8px #000}.hud{position:absolute;left:10px;right:10px;top:10px;z-index:9;display:flex;justify-content:space-between}.card{background:#ffffffe8;border-radius:16px;padding:10px 12px;font-weight:900;box-shadow:0 10px 24px #0004}.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#000b;color:#fff;border-radius:999px;padding:10px 13px;font-weight:900;display:none;z-index:20}.enc{position:fixed;inset:0;background:#0009;display:none;z-index:30}.panel{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,430px);background:#fff;border-radius:24px;overflow:hidden}.stage{height:210px;background:linear-gradient(#96ddff,#62bd7e);position:relative}.target{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.target img{width:100%;height:100%;object-fit:contain}.net{position:absolute;right:-25px;bottom:-35px;width:200px}.body{padding:14px}.bar{height:32px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(90deg,#e94d73 0 25%,#ffd166 25% 40%,#20b486 40% 60%,#ffd166 60% 75%,#e94d73 75%)}.cur{position:absolute;top:-4px;width:6px;height:42px;background:#111;border-radius:4px;box-shadow:0 0 0 2px white}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:1000}</style></head><body><div id="title"><div class="logo">버그헌터즈</div><div>안정 실행판 · 터치/드래그 복구</div><button id="start" class="btn">탐험 시작</button></div><div id="game"><div id="map" class="map"></div><div id="bugs"></div><div class="player"><img src="assets/player.png" onerror="this.remove();this.parentNode.textContent='🧢'"></div><div class="hud"><div class="card">드래그 이동</div><div class="card">POINT <span id="pt">0</span></div></div><div id="toast" class="toast"></div></div><div id="enc" class="enc"><div class="panel"><div class="stage"><img class="net" src="assets/net.png"><div id="target" class="target"></div></div><div class="body"><div id="name" style="font-weight:1000;text-align:center;margin-bottom:8px"></div><div class="bar"><div id="cur" class="cur"></div></div><div id="judge" style="text-align:center;font-weight:1000;margin-top:8px">타이밍!</div><div class="row"><button id="catch">채집!</button><button id="close">닫기</button></div></div></div></div><script>const B=[['개미','ant.png','🐜'],['배추흰나비','cabbage_butterfly.png','🦋'],['청띠신선나비','blue_band_butterfly.png','🦋'],['검노랑나비','black_yellow_butterfly.png','🦋'],['잠자리','brown_dragonfly.png','🪰'],['물방개','diving_beetle.png','🪲'],['반딧불이','firefly.png','✨'],['장수말벌','giant_hornet.png','🐝'],['물장군','giant_water_bug.png','🪲'],['귀뚜라미','cricket.png','🦗']];let x=0,y=0,head=0,pt=0,ents=[],drag=false,lx=0,ly=0,vx=0,vy=0,cur=null,t0=0;function img(b){return `<img src="assets/insects/${b[1]}" onerror="this.remove();this.parentNode.textContent='${b[2]}'">`}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1200)}function add(){let b=B[Math.floor(Math.random()*B.length)];ents.push({b,dx:(Math.random()*2-1)*45,dy:(Math.random()*2-1)*45})}function start(){document.getElementById('title').style.display='none';document.getElementById('game').style.display='block';while(ents.length<4)add();toast('탐험 시작! 드래그로 이동')}function render(){document.getElementById('map').style.transform=`rotate(${-head}deg) translate(${-x*2}px,${-y*2}px) scale(1.05)`;let box=document.getElementById('bugs');box.innerHTML='';ents.forEach((e,i)=>{let d=Math.hypot(e.dx,e.dy);let n=document.createElement('div');n.className='bug';n.style.transform=`translate(calc(50% + ${e.dx*7}px),calc(50% + ${e.dy*7}px)) translate(-50%,-50%) scale(${Math.max(.55,1.2-d/70)})`;n.innerHTML=`<div class="sp">${img(e.b)}</div><div class="lab">${d<14?'채집 가능':'가까이'} · ${e.b[0]}</div>`;n.onclick=()=>{if(d>14)toast('더 가까이 가야 해');else openEnc(i)};box.appendChild(n)});document.getElementById('pt').textContent=pt}function move(f,s){let r=head*Math.PI/180,dx=s*Math.cos(r)-(-f)*Math.sin(r),dy=s*Math.sin(r)+(-f)*Math.cos(r);x+=dx;y+=dy;ents.forEach(e=>{e.dx-=dx;e.dy-=dy})}function openEnc(i){cur=i;t0=performance.now();let b=ents[i].b;document.getElementById('target').innerHTML=img(b);document.getElementById('name').textContent=b[0];document.getElementById('enc').style.display='block'}function closeEnc(){document.getElementById('enc').style.display='none';cur=null}function pos(){return(0.5+0.5*Math.sin((performance.now()-t0)*.001*Math.PI*2))*100}function judge(p){let d=Math.abs(p-50);if(d<7)return['PERFECT',30];if(d<16)return['GREAT',22];if(d<28)return['GOOD',15];return['MISS',0]}function loop(){vx*=.86;vy*=.86;if(Math.abs(vx)+Math.abs(vy)>.001)move(vy*.45,vx*.45);while(ents.length<4)add();render();if(cur!==null){let p=pos(),j=judge(p);document.getElementById('cur').style.left=`calc(${p}% - 3px)`;document.getElementById('judge').textContent=j[0]}requestAnimationFrame(loop)}document.getElementById('start').onclick=start;document.getElementById('close').onclick=closeEnc;document.getElementById('catch').onclick=()=>{if(cur===null)return;let j=judge(pos());if(j[1]>0){pt+=j[1];ents.splice(cur,1);toast(j[0]+' +'+j[1]+'P');closeEnc()}else toast('실패, 다시 시도')};let g=document.getElementById('game');g.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});g.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;vx=Math.max(-1,Math.min(1,dx*.025));vy=Math.max(-1,Math.min(1,-dy*.025));head=(head+dx*.12+360)%360});g.addEventListener('pointerup',()=>drag=false);g.addEventListener('pointercancel',()=>drag=false);requestAnimationFrame(loop);</script></body></html>
