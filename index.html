<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>버그헌터즈 v0.2</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}#app{position:fixed;inset:0;overflow:hidden}.screen{position:absolute;inset:0;display:none}.active{display:block}button{font-family:inherit}.title{background:radial-gradient(circle at 50% 30%,#3bdc9770,transparent 30%),linear-gradient(#123457,#07111e);color:white}.titleUI{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:30px 18px;gap:12px;text-align:center}.logo{font-size:42px;font-weight:1000;text-shadow:0 15px 30px #000}.sub{font-size:13px;font-weight:800;color:#ffffffcc;line-height:1.45;max-width:360px}.btn{border:0;border-radius:18px;padding:14px 20px;min-width:230px;font-size:16px;font-weight:1000;box-shadow:0 16px 34px #0008}.primary{background:linear-gradient(120deg,#82f7c1,#6bb2ff,#a573ed,#f8b871);color:#101522}.ghost{background:#ffffff22;color:white;border:1px solid #ffffff44}#view{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;background:linear-gradient(#84c7ff,#c4f1ff 55%,#6fd27d)}#worldWrap{position:absolute;inset:-45%;transform-origin:50% 50%;will-change:transform}#world{position:absolute;inset:0}.layer{position:absolute;inset:-20%;will-change:transform}#sky{background:radial-gradient(circle at 30% 18%,#fff,transparent 15%),linear-gradient(#82c7ff,#c9f3ff 56%,#70d281)}#mid{background:radial-gradient(circle at 18% 55%,#2f9448 0 8%,transparent 22%),radial-gradient(circle at 50% 45%,#257942 0 10%,transparent 25%),radial-gradient(circle at 78% 60%,#319754 0 9%,transparent 24%),linear-gradient(90deg,#70c66c,#4caf62,#7dd07a);opacity:.9}#fore{background:radial-gradient(circle at 15% 90%,#1e8d45 0 9%,transparent 20%),radial-gradient(circle at 45% 100%,#279f54 0 12%,transparent 24%),radial-gradient(circle at 75% 95%,#1d8044 0 10%,transparent 22%),linear-gradient(#33b466,#21864b)}#path{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 80px,#ffffff14 82px 86px),radial-gradient(ellipse at 50% 60%,#fff1b444,transparent 38%)}#entities{position:absolute;inset:0;z-index:20;transform-origin:50% 50%}.entity{position:absolute;left:50%;top:50%;transform-origin:50% 70%;cursor:pointer}.sprite{width:60px;height:60px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#ffffffe8;border:3px solid var(--grade,#fff);box-shadow:0 18px 24px #0005,0 0 20px var(--glow,#fff8)}.label{margin-top:6px;text-align:center;font-size:11px;font-weight:1000;color:white;text-shadow:0 2px 10px #000;white-space:nowrap}.hint{position:absolute;left:50%;top:-13px;transform:translateX(-50%);background:#0008;color:white;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:1000}.locked{opacity:.58}#fog{position:absolute;inset:0;z-index:25;background:radial-gradient(ellipse at 50% 54%,transparent 0 36%,#050c142c 55%,#050c145d);pointer-events:none}#player{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;font-size:74px;filter:drop-shadow(0 18px 20px #0007);pointer-events:none}#player:before{content:'🧢'}#player:after{content:'▲';position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:18px;color:white;text-shadow:0 3px 10px #000}.hud{position:absolute;z-index:40}.card{background:#ffffffe0;border-radius:16px;padding:10px 12px;box-shadow:0 12px 28px #0004;backdrop-filter:blur(8px);font-weight:1000}.top{left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.top .card{pointer-events:auto}.meta{font-size:12px;color:#10152299}.pill{display:inline-block;margin-top:4px;background:#00000012;border-radius:999px;padding:6px 9px;font-size:11px;color:#101522aa}#compass{left:50%;top:10px;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:#ffffffbf;display:flex;align-items:center;justify-content:center;font-weight:1000;box-shadow:0 12px 28px #0004;pointer-events:none}#needle{position:absolute;font-size:23px;transform-origin:50% 50%}#deg{position:absolute;bottom:12px;font-size:10px}#mini{right:10px;top:88px;width:92px;height:92px;border-radius:22px;background:#050a1288;border:1px solid #fff4;box-shadow:0 16px 34px #0005;overflow:hidden}#mini:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#7effb055,transparent 34%),linear-gradient(45deg,#ffffff14 25%,transparent 25% 50%,#ffffff14 50% 75%,transparent 75%);background-size:100% 100%,18px 18px}.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:white;box-shadow:0 0 12px white}.me{left:42px;top:42px;background:#6bb2ff}.bug{background:#ffe46b}.treasure{background:#f185ae}.bottom{left:0;right:0;bottom:0;padding:10px 10px 14px}.bar{display:flex;gap:8px;justify-content:center}.icon{border:0;border-radius:18px;padding:12px 9px;min-width:86px;background:#ffffff2b;border:1px solid #fff4;color:white;font-weight:1000;box-shadow:0 14px 26px #0005}.icon span{display:block;font-size:10px;opacity:.85}.overlay{position:absolute;inset:0;background:#070a12aa;backdrop-filter:blur(8px);display:none;z-index:70}.overlay.active{display:block}.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,520px);max-height:min(84vh,720px);overflow:auto;background:#fffffff0;border-radius:24px;padding:14px;box-shadow:0 28px 70px #0008}h2{margin:8px 6px 12px;font-size:17px}.row{display:flex;gap:10px;flex-wrap:wrap}.kv{flex:1;min-width:140px;background:#0000000f;border-radius:18px;padding:11px 12px;margin-top:8px}.k{font-size:11px;font-weight:1000;color:#0008}.v{font-size:15px;font-weight:1000;margin-top:4px}.mbtn{border:0;border-radius:16px;padding:11px 12px;font-weight:1000}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.badge{font-size:10px;font-weight:1000;padding:6px 8px;border-radius:999px;background:#0001;display:inline-block;margin:3px}.grade{background:var(--grade);box-shadow:0 0 12px var(--glow)}#enc{z-index:90}#encCard{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(94vw,520px);background:white;border-radius:28px;overflow:hidden;box-shadow:0 28px 74px #0009}#encTop{height:228px;position:relative;background:radial-gradient(circle at 50% 35%,#fff,transparent 32%),linear-gradient(#94ddff,#61bd7d)}#encIcon{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:108px;height:108px;border-radius:34px;display:flex;align-items:center;justify-content:center;font-size:58px;background:white;border:5px solid var(--grade);box-shadow:0 18px 34px #0004,0 0 32px var(--glow)}#encName{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:18px;font-weight:1000}#encBody{padding:14px}.rate{height:14px;background:#0001;border-radius:999px;overflow:hidden;margin-top:10px}.rate>div{height:100%;background:linear-gradient(120deg,#82f7c1,#6bb2ff,#a573ed);width:60%}#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#000a;color:white;padding:10px 13px;border-radius:999px;font-weight:1000;font-size:12px;display:none;z-index:110;white-space:nowrap}@media(min-width:860px){#app{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px #fff1,0 32px 80px #0009}}
</style></head><body><div id="app"><div id="title" class="screen title active"><div class="titleUI"><div class="logo">버그헌터즈</div><div class="sub">회전하는 지도 위에서 곤충을 찾고, 10색 희귀도 도감을 완성하세요.</div><button id="start" class="btn primary">탐험 시작</button><button id="quickDex" class="btn ghost">도감 보기</button><div class="sub">v0.2 · 회전 카메라 · 10색 희귀도 · 일일미션</div></div></div><div id="field" class="screen"><div id="view"><div id="worldWrap"><div id="world"><div id="sky" class="layer"></div><div id="mid" class="layer"></div><div id="fore" class="layer"></div><div id="path"></div></div></div><div id="entities"></div><div id="fog"></div><div id="player"></div></div><div class="hud top"><div id="profile" class="card"><div id="pname">은성이</div><div id="ptitle" class="meta">초보 헌터</div><div id="env" class="pill">숲</div></div><div class="card"><div class="meta">POINT</div><div id="points">0</div></div></div><div id="compass" class="hud"><div id="needle">▲</div><div id="deg">0°</div></div><div id="mini" class="hud"><div class="dot me"></div></div><div class="hud bottom"><div class="bar"><button id="dexBtn" class="icon">도감<span>컬렉션</span></button><button id="missionBtn" class="icon">미션<span>오늘</span></button><button id="bagBtn" class="icon">아이템<span>상점</span></button><button id="setBtn" class="icon">설정<span>테스트</span></button></div></div><div id="toast"></div></div><div id="overlay" class="overlay"><div id="modal" class="modal"></div></div><div id="enc" class="overlay"><div id="encCard"><div id="encTop"><div id="encIcon">🐞</div><div id="encName">곤충</div></div><div id="encBody"><div id="encMeta"></div><div class="rate"><div id="rateBar"></div></div><div id="result" style="margin-top:10px;font-weight:1000"></div><div class="actions"><button id="bait" class="mbtn">먹이</button><button id="catch" class="mbtn primary">채집!</button><button id="closeEnc" class="mbtn">닫기</button></div></div></div></div></div><script>
const BUGS=[['톱사슴벌레','saw','BE-001',['FOREST'],'🪲','큰 턱을 가진 숲의 인기 곤충'],['장수풍뎅이','rhino','BE-002',['FOREST','MOUNTAIN'],'🪲','강한 뿔과 힘을 가진 곤충'],['비단벌레','jewel','BE-003',['FOREST'],'🪲','반짝이는 금속 광택이 특징'],['배추흰나비','cabbage','LE-001',['PARK','FARM','CITY'],'🦋','도심에서도 자주 만나는 흰 나비'],['호랑나비','swallow','LE-002',['PARK','GRASSLAND'],'🦋','크고 우아하게 나는 나비'],['청띠신선나비','blueband','LE-003',['FOREST'],'🦋','푸른 띠가 아름다운 희귀 나비'],['말매미','cicada','CI-001',['FOREST','CITY'],'🪰','여름 숲과 도심의 큰 목소리'],['고추잠자리','dragon','DR-001',['LAKE','PARK'],'🪰','붉은 몸색의 친숙한 잠자리'],['꿀벌','bee','HY-001',['PARK','FARM'],'🐝','꽃가루를 옮기는 중요한 곤충'],['장수말벌','hornet','HY-002',['MOUNTAIN','FOREST'],'🐝','강력하지만 조심해야 하는 곤충'],['메뚜기','grass','OR-001',['GRASSLAND','FARM'],'🦗','들판에서 멀리 뛰는 초식 곤충'],['난초사마귀','mantis','MA-001',['FOREST','PARK'],'🦗','꽃처럼 위장하는 특별한 사마귀'],['물방개','diving','AQ-001',['LAKE','RIVER'],'🪲','물속을 누비는 수서 곤충'],['물장군','waterbug','AQ-002',['LAKE','WETLAND'],'🪲','수서 생태계의 강한 포식자'],['공벌레','pill','OT-001',['FOREST','CITY'],'🐛','몸을 둥글게 마는 작은 생물']].map(x=>({name:x[0],key:x[1],id:x[2],regions:x[3],emoji:x[4],desc:x[5]}));
const G=[['RED','빨강','#ff4a4a','rgba(255,74,74,.55)',230,10,.72],['ORANGE','주황','#ff9d3d','rgba(255,157,61,.55)',190,14,.70],['YELLOW','노랑','#ffe45c','rgba(255,228,92,.55)',150,18,.68],['GREEN','초록','#43d96b','rgba(67,217,107,.55)',115,24,.66],['BLUE','파랑','#4fb2ff','rgba(79,178,255,.55)',82,32,.63],['NAVY','남색','#4967ff','rgba(73,103,255,.55)',55,42,.60],['PURPLE','보라','#a573ed','rgba(165,115,237,.6)',34,56,.56],['SILVER','실버','#d8e3ee','rgba(216,227,238,.75)',20,76,.52],['GOLD','골드','#ffd166','rgba(255,209,102,.8)',10,110,.48],['DIAMOND','다이아','#9ff8ff','rgba(159,248,255,.9)',4,180,.42]].map(x=>({key:x[0],ko:x[1],color:x[2],glow:x[3],weight:x[4],points:x[5],rate:x[6]}));
const SHOP=[['kit','채집세트','채집 시도 5회 추가',80],['bait','달콤한 먹이','이번 채집 성공률 +18%',90],['spray','진정 스프레이','다음 3회 접근 도망률 감소',140],['flash','야간 플래시','밤/안개 보정',160]].map(x=>({key:x[0],name:x[1],desc:x[2],price:x[3]}));
const DEF={playerName:'은성이',points:0,title:'초보 헌터',stats:{totalCaught:0,totalSeen:0,totalTimeSec:0,steps:0,distanceM:0},caught:{},dexSeen:{},gradeCaught:{},items:{kit:12,bait:3,spray:1,flash:1},dailyMax:{kit:12,bait:3,spray:1,flash:1},dailyLast:'',missions:{},test:{randomStart:true,infiniteItems:false,useRealGPS:false,keyboard:true},world:{x:0,y:0,heading:0,targetHeading:0},runtime:{sprayCharges:0,flashUsedDay:'',startedToday:''}};
const $=s=>document.querySelector(s);const app={state:null,mode:'title',last:performance.now(),input:{drag:false,lx:0,ly:0,vx:0,vy:0,rot:0},entities:[],eid:1,enc:null,cool:0};let OK=true,gps=null;
function C(o){return JSON.parse(JSON.stringify(o))}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function merge(a,b){const o=Object.assign(C(a),b||{});for(const k of ['stats','items','test','world','runtime'])o[k]=Object.assign(C(a[k]),b?.[k]||{});return o}function load(){try{const r=localStorage.getItem('bug_hunters_state_v2')||localStorage.getItem('captcha_bugs_state_v1');if(r)return merge(DEF,JSON.parse(r))}catch(e){OK=false}return C(DEF)}function save(){if(!OK)return;try{localStorage.setItem('bug_hunters_state_v2',JSON.stringify(app.state))}catch(e){OK=false}}function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1500)}function show(n){$('#title').classList.toggle('active',n==='title');$('#field').classList.toggle('active',n==='field');app.mode=n}function clamp(a,b,v){return Math.max(a,Math.min(b,v))}function lerpA(a,b,t){let d=((b-a+540)%360)-180;return(a+d*t+360)%360}function rot(x,y,d){const r=d*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return{x:x*c-y*s,y:x*s+y*c}}function grade(k){return G.find(x=>x.key===k)||G[0]}function gp(){const tot=G.reduce((s,g)=>s+g.weight,0);let r=Math.random()*tot;for(const g of G){r-=g.weight;if(r<=0)return g}return G[0]}function env(x,y){const n=Math.sin(x/380)*.6+Math.cos(y/420)*.4+Math.sin((x+y)/520)*.5,w=Math.cos(x/700)*Math.sin(y/610),c=Math.sin(x/900+2.2)*Math.cos(y/880+1.7);if(w>.55)return'RIVER';if(w<-.62)return'LAKE';if(c>.62)return'CITY';if(n>.4)return'FOREST';if(n>.05)return'PARK';return'GRASSLAND'}function ko(e){return{FOREST:'숲',PARK:'공원',GRASSLAND:'초원',RIVER:'강가',LAKE:'호수',CITY:'도시',FARM:'농장',MOUNTAIN:'산',WETLAND:'습지'}[e]||e}
function daily(){const t=today();if(app.state.dailyLast!==t){app.state.dailyLast=t;for(const k in app.state.items)app.state.items[k]=app.state.dailyMax[k]??app.state.items[k];app.state.missions={date:t,caught:0,seen:0,bait:0,rare:0,rewarded:{}};app.state.runtime.sprayCharges=0;save();toast('일일 아이템/미션 갱신')}}function missions(){const m=app.state.missions||{};return[{key:'caught',name:'오늘 곤충 5마리 채집',now:m.caught||0,goal:5,reward:80},{key:'seen',name:'오늘 곤충 8마리 발견',now:m.seen||0,goal:8,reward:60},{key:'bait',name:'먹이 1회 사용',now:m.bait||0,goal:1,reward:40},{key:'rare',name:'실버 이상 1마리 채집',now:m.rare||0,goal:1,reward:120}]}function addM(k,n=1){if(!app.state.missions||app.state.missions.date!==today())daily();app.state.missions[k]=(app.state.missions[k]||0)+n;const m=app.state.missions;m.rewarded=m.rewarded||{};for(const q of missions())if(q.now>=q.goal&&!m.rewarded[q.key]){m.rewarded[q.key]=true;app.state.points+=q.reward;toast(`미션 완료 +${q.reward}P`)}}
function pickBug(){const e=env(app.state.world.x,app.state.world.y),pool=BUGS.filter(b=>b.regions.includes(e)),b=(pool.length?pool:BUGS)[Math.floor(Math.random()*(pool.length?pool:BUGS).length)],g=gp();return{...b,grade:g.key,_env:e}}function make(kind,data){return{id:app.eid++,kind,data,dx:(Math.random()*2-1)*(16+Math.random()*36),dy:(Math.random()*2-1)*(16+Math.random()*36),r:13,node:null,rolled:false}}function ensure(){if(performance.now()<app.cool)return;while(app.entities.filter(e=>e.kind==='bug').length<4){const b=pickBug();app.state.dexSeen[b.key]=true;addM('seen');app.entities.push(make('bug',b))}if(app.entities.filter(e=>e.kind==='treasure').length<1&&Math.random()<.16)app.entities.push(make('treasure',{name:'보물상자',grade:'GOLD',emoji:'🎁'}))}function del(id){const i=app.entities.findIndex(e=>e.id===id);if(i>=0){app.entities[i].node?.remove();app.entities.splice(i,1)}}function near(e){return Math.hypot(e.dx,e.dy)<=e.r}function title(){const n=app.state.stats.totalCaught;return n>=150?'곤충왕':n>=80?'마스터 헌터':n>=30?'노련한 헌터':n>=10?'곤충 헌터':'초보 헌터'}function hud(){app.state.title=title();$('#pname').textContent=app.state.playerName;$('#ptitle').textContent=app.state.title;$('#points').textContent=app.state.points;$('#env').textContent=ko(env(app.state.world.x,app.state.world.y))}
function modal(type){const m=$('#modal');$('#overlay').classList.add('active');m.innerHTML='';if(type==='profile')m.innerHTML=`<h2>프로필</h2><div class=row><div class=kv><div class=k>총 채집</div><div class=v>${app.state.stats.totalCaught}</div></div><div class=kv><div class=k>발견</div><div class=v>${Object.keys(app.state.dexSeen).length}/${BUGS.length}</div></div><div class=kv><div class=k>거리</div><div class=v>${Math.round(app.state.stats.distanceM)}m</div></div><div class=kv><div class=k>방향</div><div class=v>${Math.round(app.state.world.heading)}°</div></div></div><div class=actions><button class=mbtn onclick="closeModal()">닫기</button></div>`;if(type==='missions'){m.innerHTML='<h2>일일미션</h2>'+missions().map(q=>`<div class=kv><b>${q.now>=q.goal?'✅':'⬜'} ${q.name}</b><div class=k>${Math.min(q.now,q.goal)} / ${q.goal} · 보상 ${q.reward}P ${app.state.missions.rewarded?.[q.key]?'수령완료':''}</div></div>`).join('')+'<div class=actions><button class=mbtn onclick="closeModal()">닫기</button></div>'}if(type==='bag'){m.innerHTML='<h2>아이템</h2><div class=row>'+Object.entries(app.state.items).map(([k,v])=>`<div class=kv><div class=k>${SHOP.find(s=>s.key===k)?.name||k}</div><div class=v>${v}</div></div>`).join('')+'</div><h2>상점</h2>'+SHOP.map(s=>`<div class=kv><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>${s.name} (${s.price}P)</b><div class=k>${s.desc}</div></div><button class="mbtn primary" onclick="buy('${s.key}')">구매</button></div></div>`).join('')+'<div class=actions><button class=mbtn onclick="closeModal()">닫기</button></div>'}if(type==='dex'){m.innerHTML='<h2>도감</h2><div class=dex>'+BUGS.map(b=>{const seen=app.state.dexSeen[b.key],cnt=G.filter(g=>app.state.gradeCaught[b.key+'__'+g.key]).length;return`<div class=kv onclick="dexCard('${b.key}')"><div style="font-size:32px">${seen?b.emoji:'❔'}</div><b>${seen?b.name:'???'}</b><div class=k>${seen?b.id:'미확인'} · 컬러 ${cnt}/10</div><div>${G.map(g=>`<span class="badge grade" style="--grade:${g.color};--glow:${g.glow};opacity:${app.state.gradeCaught[b.key+'__'+g.key]?1:.22}">${g.ko}</span>`).join('')}</div></div>`}).join('')+'</div><div class=actions><button class=mbtn onclick="closeModal()">닫기</button></div>'}if(type==='settings'){const t=app.state.test;m.innerHTML=`<h2>설정</h2><div class=kv><div class=k>플레이어 이름</div><input id=nameInput value="${app.state.playerName}" style="width:100%;margin-top:8px;padding:12px;border-radius:14px;border:1px solid #0002;font-weight:900"></div><div class=kv><label><input id=randomStart type=checkbox ${t.randomStart?'checked':''}> 시작 위치 매일 랜덤</label><br><label><input id=infiniteItems type=checkbox ${t.infiniteItems?'checked':''}> 아이템 무한</label><br><label><input id=useRealGPS type=checkbox ${t.useRealGPS?'checked':''}> 실제 GPS 사용</label><br><label><input id=keyboard type=checkbox ${t.keyboard?'checked':''}> 키보드 조작</label><div class=k style="margin-top:8px">드래그: 위/아래 이동, 좌/우 회전</div></div><div class=actions><button class=mbtn onclick="resetSave()">초기화</button><button class="mbtn primary" onclick="applySet()">적용</button><button class=mbtn onclick="closeModal()">닫기</button></div>`}}
function closeModal(){$('#overlay').classList.remove('active');$('#modal').innerHTML=''}window.closeModal=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};window.buy=k=>{const s=SHOP.find(x=>x.key===k);if(!app.state.test.infiniteItems&&app.state.points<s.price){toast('포인트 부족');return}if(!app.state.test.infiniteItems)app.state.points-=s.price;app.state.items[k]+=(k==='kit'?5:1);save();hud();modal('bag')};window.dexCard=k=>{const b=BUGS.find(x=>x.key===k),seen=app.state.dexSeen[k];$('#modal').innerHTML=`<h2>도감 카드</h2><div class=kv><div style="font-size:54px">${seen?b.emoji:'❔'}</div><div class=v>${seen?b.name:'???'}</div><div class=k>${seen?b.desc:'아직 발견하지 못했습니다.'}</div></div><h2>컬러 수집</h2>${G.map(g=>`<span class="badge grade" style="--grade:${g.color};--glow:${g.glow};opacity:${app.state.gradeCaught[k+'__'+g.key]?1:.24}">${g.ko}</span>`).join('')}<div class=actions><button class=mbtn onclick="modal('dex')">목록</button></div>`};window.modal=modal;window.applySet=()=>{app.state.playerName=$('#nameInput').value.trim()||'은성이';app.state.test.randomStart=$('#randomStart').checked;app.state.test.infiniteItems=$('#infiniteItems').checked;app.state.test.useRealGPS=$('#useRealGPS').checked;app.state.test.keyboard=$('#keyboard').checked;save();hud();if(app.state.test.useRealGPS)startGPS();toast('설정 적용');closeModal()};window.resetSave=()=>{if(confirm('세이브를 초기화할까요?')){localStorage.removeItem('bug_hunters_state_v2');localStorage.removeItem('captcha_bugs_state_v1');location.reload()}}
function openEnc(e){const g=grade(e.data.grade);app.enc={id:e.id,data:e.data,bait:false};$('#encIcon').textContent=e.data.emoji;$('#encIcon').style.setProperty('--grade',g.color);$('#encIcon').style.setProperty('--glow',g.glow);$('#encName').textContent=`${g.ko} ${e.data.name}`;updEnc();$('#result').textContent='';$('#enc').classList.add('active');app.mode='enc'}function closeEnc(){$('#enc').classList.remove('active');app.mode='field';app.enc=null}function chance(){if(!app.enc)return.6;let p=grade(app.enc.data.grade).rate;if(app.enc.bait)p+=.18;return clamp(.34,.92,p)}function updEnc(){const d=app.enc.data,g=grade(d.grade),p=chance();$('#encMeta').innerHTML=`<span class="badge grade" style="--grade:${g.color};--glow:${g.glow}">${g.ko}</span><span class=badge>${ko(d._env)}</span><span class=badge>성공률 ${Math.round(p*100)}%</span>`;$('#rateBar').style.width=Math.round(p*100)+'%';$('#bait').textContent=`먹이 (${app.state.items.bait})`}function consume(k){if(app.state.test.infiniteItems)return true;if((app.state.items[k]||0)<1)return false;app.state.items[k]--;return true}$('#bait').onclick=()=>{if(!app.enc)return;if(app.enc.bait){toast('이미 사용함');return}if(!consume('bait')){toast('먹이 부족');return}app.enc.bait=true;addM('bait');save();updEnc();toast('성공률 상승')};$('#closeEnc').onclick=closeEnc;$('#catch').onclick=()=>{const e=app.entities.find(x=>x.id===app.enc?.id);if(!e){closeEnc();return}if(!app.state.test.infiniteItems&&app.state.items.kit<=0){toast('채집세트 부족');return}if(!app.state.test.infiniteItems)app.state.items.kit--;const ok=Math.random()<chance(),g=grade(e.data.grade),r=$('#result');if(ok){app.state.points+=g.points;app.state.stats.totalCaught++;app.state.caught[e.data.key]=(app.state.caught[e.data.key]||0)+1;app.state.gradeCaught[e.data.key+'__'+g.key]=(app.state.gradeCaught[e.data.key+'__'+g.key]||0)+1;addM('caught');if(['SILVER','GOLD','DIAMOND'].includes(g.key))addM('rare');r.style.color='#20b486';r.textContent=`잡았다! +${g.points}P`;del(e.id);setTimeout(closeEnc,650)}else{r.style.color='#e94d73';r.textContent='놓쳤다… 하지만 바로 사라지진 않아!';e.rolled=true}save();hud()};
function move(f,side=0){const v=rot(side,-f,app.state.world.heading);app.state.world.x+=v.x;app.state.world.y+=v.y;for(const e of app.entities){e.dx-=v.x;e.dy-=v.y}const d=Math.hypot(v.x,v.y);if(d){app.state.stats.distanceM+=d;app.state.stats.steps+=Math.round(d/.8)}save()}function renderWorld(now){const w=app.state.world;w.heading=lerpA(w.heading,w.targetHeading,.12);$('#worldWrap').style.transform=`rotate(${-w.heading}deg) scale(1.06)`;$('#entities').style.transform=`rotate(${-w.heading}deg)`;const s=7.2,b=Math.sin(now/120);$('#sky').style.transform=`translate(${-w.x*.05*s}px,${-w.y*.04*s}px)`;$('#mid').style.transform=`translate(${-w.x*.15*s+b}px,${-w.y*.12*s}px)`;$('#fore').style.transform=`translate(${-w.x*.28*s+b*2}px,${-w.y*.22*s}px)`;$('#needle').style.transform=`rotate(${w.heading}deg)`;$('#deg').textContent=Math.round(w.heading)+'°';$('#env').textContent=ko(env(w.x,w.y))}function renderEnt(){const wrap=$('#entities');for(const e of app.entities){if(!e.node){const n=document.createElement('div');n.className='entity '+e.kind;const sp=document.createElement('div');sp.className='sprite';const g=grade(e.data.grade||'GOLD');sp.style.setProperty('--grade',g.color);sp.style.setProperty('--glow',g.glow);sp.textContent=e.kind==='treasure'?'🎁':e.data.emoji;const h=document.createElement('div');h.className='hint';h.textContent='가까이';h.style.display='none';const l=document.createElement('div');l.className='label';l.textContent=e.kind==='treasure'?'보물상자':`${g.ko} ${e.data.name}`;n.append(h,sp,l);n.onclick=ev=>{ev.stopPropagation();tap(e.id)};wrap.appendChild(n);e.node=n}const px=e.dx*7.2,py=e.dy*7.2,d=Math.hypot(e.dx,e.dy),sc=clamp(.46,1.35,1.22-Math.pow(d/45,1.55));e.node.style.transform=`translate(calc(50% + ${px}px),calc(50% + ${py}px)) translate(-50%,-50%) scale(${sc}) rotate(${app.state.world.heading}deg)`;e.node.style.filter=`blur(${clamp(0,1.1,d/45)}px)`;const h=e.node.querySelector('.hint');if(!near(e)){e.node.classList.add('locked');h.style.display='block';e.rolled=false}else{e.node.classList.remove('locked');h.style.display='none';if(e.kind==='bug'&&!e.rolled){e.rolled=true;let esc=app.state.runtime.sprayCharges>0?.05:.20;if(Math.random()<esc){del(e.id);toast('곤충이 풀숲으로 이동했다…');continue}}}}mini()}function mini(){const mm=$('#mini');mm.querySelectorAll('.bug,.treasure').forEach(n=>n.remove());for(const e of app.entities.slice(0,8)){const d=document.createElement('div');d.className='dot '+(e.kind==='treasure'?'treasure':'bug');d.style.left=clamp(5,82,46+e.dx*1.1)+'px';d.style.top=clamp(5,82,46+e.dy*1.1)+'px';mm.appendChild(d)}}function tap(id){const e=app.entities.find(x=>x.id===id);if(!e)return;if(!near(e)){toast('더 가까이 가야 해');return}if(e.kind==='treasure'){app.state.points+=50;toast('보물상자 +50P');del(e.id);save();hud();return}openEnc(e)}function tick(now){const dt=Math.min(.05,(now-app.last)/1000);app.last=now;if(app.mode==='field'){app.state.stats.totalTimeSec+=dt;app.input.vx*=.84;app.input.vy*=.84;app.input.rot*=.82;app.state.world.targetHeading=(app.state.world.targetHeading+app.input.rot*110*dt+360)%360;if(!app.state.test.useRealGPS){const f=-app.input.vy*22*dt,side=app.input.vx*22*.25*dt;if(Math.abs(f)+Math.abs(side)>.001)move(f,side)}ensure();renderWorld(now);renderEnt()}requestAnimationFrame(tick)}function bindInput(){const v=$('#view');v.addEventListener('pointerdown',e=>{if(app.mode!=='field'||e.target.closest('.entity'))return;e.preventDefault();app.input.drag=true;app.input.lx=e.clientX;app.input.ly=e.clientY;try{v.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});v.addEventListener('pointermove',e=>{if(!app.input.drag||app.mode!=='field')return;e.preventDefault();const dx=e.clientX-app.input.lx,dy=e.clientY-app.input.ly;app.input.lx=e.clientX;app.input.ly=e.clientY;app.input.rot=clamp(-1,1,dx*.018);app.input.vy=clamp(-1,1,dy*.012)},{passive:false});['pointerup','pointercancel'].forEach(ev=>v.addEventListener(ev,()=>app.input.drag=false));v.addEventListener('contextmenu',e=>e.preventDefault())}function bindKeys(){const ks=new Set();window.addEventListener('keydown',e=>{if(!app.state?.test?.keyboard)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape'].includes(e.key)){e.preventDefault();e.stopPropagation()}ks.add(e.key);if(app.mode==='enc'){if(e.key==='Enter'||e.key===' ')$('#catch').click();if(e.key==='Escape')closeEnc();return}if(app.mode!=='field'){if(e.key==='Escape')closeModal();return}if(e.key==='Enter'||e.key===' '){const c=app.entities.filter(near).sort((a,b)=>Math.hypot(a.dx,a.dy)-Math.hypot(b.dx,b.dy))[0];if(c)tap(c.id)}},{capture:true});window.addEventListener('keyup',e=>ks.delete(e.key));setInterval(()=>{if(!app.state?.test?.keyboard||app.mode!=='field'||app.state.test.useRealGPS)return;if(ks.has('ArrowLeft'))app.input.rot=-.9;if(ks.has('ArrowRight'))app.input.rot=.9;let vy=0;if(ks.has('ArrowUp'))vy=-1;if(ks.has('ArrowDown'))vy=1;app.input.vy=vy*.8+app.input.vy*.2},50)}
function bearing(a,b,c,d){const R=x=>x*Math.PI/180,D=x=>x*180/Math.PI,y=Math.sin(R(d-b))*Math.cos(R(c)),x=Math.cos(R(a))*Math.sin(R(c))-Math.sin(R(a))*Math.cos(R(c))*Math.cos(R(d-b));return(D(Math.atan2(y,x))+360)%360}function startGPS(){if(!app.state.test.useRealGPS)return;if(location.protocol!=='https:'&&location.hostname!=='localhost'){toast('GPS는 https에서만 동작');app.state.test.useRealGPS=false;save();return}if(!navigator.geolocation){toast('GPS 미지원');app.state.test.useRealGPS=false;save();return}if(gps!=null)return;let last=null;gps=navigator.geolocation.watchPosition(p=>{const lat=p.coords.latitude,lon=p.coords.longitude;if(!last){last={lat,lon};return}const dlat=(lat-last.lat)*111000,dlon=(lon-last.lon)*88000,dist=Math.hypot(dlat,dlon);if(dist>.4){app.state.world.targetHeading=bearing(last.lat,last.lon,lat,lon);move(dist,0)}last={lat,lon}},()=>{toast('GPS 오류: 가상 이동으로');app.state.test.useRealGPS=false;gps=null;save()},{enableHighAccuracy:true,maximumAge:1000,timeout:8000})}function startPos(){if(app.state.test.randomStart&&app.state.runtime.startedToday!==today()){app.state.world.x=(Math.random()-.5)*1600;app.state.world.y=(Math.random()-.5)*1600;app.state.world.heading=Math.random()*360;app.state.world.targetHeading=app.state.world.heading;app.state.runtime.startedToday=today();save()}}
function init(){app.state=load();daily();startPos();hud();$('#start').onclick=()=>{show('field');ensure();toast('탐험 시작! 좌우 드래그로 지도 회전')};$('#quickDex').onclick=()=>{show('field');modal('dex')};$('#profile').onclick=()=>modal('profile');$('#dexBtn').onclick=()=>modal('dex');$('#missionBtn').onclick=()=>modal('missions');$('#bagBtn').onclick=()=>modal('bag');$('#setBtn').onclick=()=>modal('settings');bindInput();bindKeys();if(app.state.test.useRealGPS)startGPS();requestAnimationFrame(tick)}init();
</script></body></html>
